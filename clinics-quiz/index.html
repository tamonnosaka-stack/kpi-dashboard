<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>CLINICS導入研修：理解度確認テスト（完全版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f4f8;
    --ink: #1a2b3c;
    --muted: #55708a;
    --card-bg: #fff;
    --card-border: #e1e9f1;
    --accent: #0b5cab;
    --accent-2: #1379d4;
    --accent-soft: #e3eef8;
    --option-border: #dbe5ee;
    --option-hover-bg: #f2f8fd;
    --option-hover-border: #8fbde6;
    --good: #38a169;
    --good-ink: #276749;
    --good-bg: #e8f7ee;
    --bad: #e05252;
    --bad-ink: #c53030;
    --bad-bg: #fdeaea;
    --warn: #d9a90f;
    /* --warn は罫線・アイコン用。本文に使うと白背景で 2.1:1 しかないため文字用を別に持つ */
    --warn-ink: #8a6a00;
    --warn-bg: #fbf6e9;
    --progress-track: #d7e3ee;
  }
  :root[data-theme="dark"] {
    --bg: #0f1720;
    --ink: #e6edf5;
    --muted: #93a7bc;
    --card-bg: #17202b;
    --card-border: #263140;
    --accent: #4da3ff;
    --accent-2: #2f8fe6;
    --accent-soft: #16283b;
    --option-border: #2a3646;
    --option-hover-bg: #1b2b3d;
    --option-hover-border: #3d5f82;
    --good: #4cbf7d;
    --good-ink: #4cbf7d;
    --good-bg: #123321;
    --bad: #ef6a6a;
    --bad-ink: #ef6a6a;
    --bad-bg: #3a1717;
    --warn: #e6bd4a;
    --warn-ink: #e6bd4a;
    --warn-bg: #332a10;
    --progress-track: #223142;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1720;
      --ink: #e6edf5;
      --muted: #93a7bc;
      --card-bg: #17202b;
      --card-border: #263140;
      --accent: #4da3ff;
      --accent-2: #2f8fe6;
      --accent-soft: #16283b;
      --option-border: #2a3646;
      --option-hover-bg: #1b2b3d;
      --option-hover-border: #3d5f82;
      --good: #4cbf7d;
      --good-ink: #4cbf7d;
      --good-bg: #123321;
      --bad: #ef6a6a;
      --bad-ink: #ef6a6a;
      --bad-bg: #3a1717;
      --warn: #e6bd4a;
      --warn-ink: #e6bd4a;
      --warn-bg: #332a10;
      --progress-track: #223142;
    }
  }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 24px;
  }
  header h1 { font-size: 1.4rem; margin-bottom: 6px; text-wrap: balance; }
  header p { font-size: 0.9rem; opacity: 0.9; }
  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 10px 0;
    margin-bottom: 12px;
  }
  .progress-row { display: flex; align-items: center; gap: 14px; }
  .progress-main { flex: 1; min-width: 0; }
  .progress-info { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; margin-bottom: 4px; color: var(--muted); }
  .progress-bar { height: 10px; background: var(--progress-track); border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-2), var(--good)); transition: width 0.3s; }
  .grade-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 0.95rem; font-weight: bold; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .grade-btn:hover { background: var(--accent-2); }
  .grade-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grade-btn.lg { padding: 14px 40px; font-size: 1.05rem; }
  .bottom-actions { text-align: center; margin-top: 28px; }
  .bottom-note { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
  .bottom-note a { color: var(--accent); font-weight: bold; }
  .unanswered-note { font-size: 0.9rem; color: var(--warn-ink); font-weight: bold; text-align: center; margin-bottom: 16px; }
  .section-title {
    font-size: 1.15rem;
    font-weight: bold;
    color: var(--accent);
    border-left: 6px solid var(--accent);
    padding: 6px 12px;
    margin: 36px 0 6px;
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
  }
  .section-desc { font-size: 0.85rem; color: var(--muted); margin: 0 0 16px 18px; }
  .question-card {
    background: var(--card-bg);
    border-radius: 10px;
    /* sticky ヘッダーがアンカー先の「問N」を覆わないための余白 */
    scroll-margin-top: 84px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(20, 50, 80, 0.08);
    border: 1px solid var(--card-border);
  }
  .q-number { display: inline-block; background: var(--accent); color: #fff; font-size: 0.8rem; font-weight: bold; border-radius: 6px; padding: 2px 10px; margin-bottom: 8px; }
  .q-text { font-weight: bold; margin-bottom: 14px; }
  .option {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 2px 10px;
    padding: 10px 14px;
    border: 2px solid var(--option-border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-size: 0.95rem;
  }
  #quiz:not(.graded) .option:hover { background: var(--option-hover-bg); border-color: var(--option-hover-border); }
  #quiz:not(.graded) .option.selected:hover { background: var(--accent-soft); border-color: var(--accent); }
  .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option .num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
  }
  .option.selected { background: var(--accent-soft); border-color: var(--accent); }
  .option.selected .num { background: var(--accent); color: #fff; }
  #quiz.graded .option { cursor: default; }
  /* flex-basis:0 にしないと、長い本文が番号の右に収まらず次の行へ落ちる */
  .option .opt-text { flex: 1 1 0; min-width: 0; }
  /* 幅を食って選択肢本文を潰さないよう、常に独立した行に置く */
  .your-mark { flex-basis: 100%; text-align: right; font-size: 0.75rem; font-weight: bold; color: var(--muted); }
  .option.correct { background: var(--good-bg); border-color: var(--good); }
  .option.correct .num { background: var(--good); color: #fff; }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .option.wrong .num { background: var(--bad); color: #fff; }
  .option.dimmed { opacity: 0.55; }
  .judge { font-weight: bold; margin-top: 6px; font-size: 1rem; }
  .judge.ok { color: var(--good-ink); }
  .judge.ng { color: var(--bad-ink); }
  .judge.na { color: var(--warn-ink); }
  .explanation {
    margin-top: 10px;
    background: var(--warn-bg);
    border-left: 4px solid var(--warn);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 0.9rem;
    display: none;
  }
  .explanation .exp-label { font-weight: bold; color: var(--warn-ink); margin-bottom: 4px; display: block; }
  .result-panel {
    display: none;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 28px 24px;
    margin-top: 36px;
    box-shadow: 0 2px 10px rgba(20, 50, 80, 0.12);
    border: 2px solid var(--accent);
  }
  .result-panel { scroll-margin-top: 84px; }
  /* inline-block にしないと、採点直後のフォーカスリングがパネル幅いっぱいの枠に見える */
  .result-panel h2 { display: inline-block; color: var(--accent); margin-bottom: 16px; font-size: 1.3rem; scroll-margin-top: 84px; }
  .result-panel h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .score-big { font-size: 2.4rem; font-weight: bold; text-align: center; margin: 10px 0; font-variant-numeric: tabular-nums; }
  .score-big small { font-size: 1.1rem; color: var(--muted); font-weight: normal; }
  .score-msg { text-align: center; font-size: 1.05rem; font-weight: bold; margin-bottom: 20px; }
  .score-bar-outer { height: 16px; background: var(--card-border); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
  .score-bar-inner { height: 100%; width: 0%; border-radius: 8px; transition: width 0.8s ease; }
  .table-scroll { overflow-x: auto; }
  table.section-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
  table.section-table th, table.section-table td { border: 1px solid var(--card-border); padding: 8px 10px; text-align: left; }
  table.section-table th { background: var(--accent-soft); color: var(--accent); }
  table.section-table td.num-cell { text-align: center; font-weight: bold; font-variant-numeric: tabular-nums; }
  .wrong-list { font-size: 0.9rem; }
  .wrong-list a { color: var(--bad); font-weight: bold; margin-right: 10px; text-decoration: none; }
  .wrong-list a:hover { text-decoration: underline; }
  .btn-area { text-align: center; margin-top: 20px; }
  button.reset-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 12px 32px; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  button.reset-btn:hover { background: var(--accent-2); }
  button.reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .perfect { color: var(--warn); }
  /* 採点後の進捗バーは「全問回答済み＝100%」を示すため、正解数の隣では満点に見えてしまう */
  .progress-wrap.graded .progress-bar { display: none; }
  @media (max-width: 480px) {
    .progress-info { font-size: 0.75rem; }
    .progress-info span { white-space: nowrap; }
    .progress-row { gap: 10px; }
    .grade-btn { padding: 9px 14px; font-size: 0.88rem; }
    .question-card { padding: 16px 14px; }
    header { padding: 20px 18px; }
    header h1 { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-fill, .score-bar-inner { transition: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CLINICS導入研修：理解度確認テスト（完全版）</h1>
    <p>全40問・3択形式。回答は何度でも選び直せます。すべて選び終えたら「採点する」を押すと、正誤と解説がまとめて表示されます。</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-row">
      <div class="progress-main">
        <div class="progress-info">
          <span>回答 <b id="answeredCount">0</b> / 40 問</span>
          <span id="statusNote" aria-live="polite"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <button type="button" class="grade-btn" id="gradeBtn" onclick="gradeQuiz()">採点する</button>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="bottom-actions" id="bottomActions">
    <p class="bottom-note" id="bottomNote"></p>
    <button type="button" class="grade-btn lg" onclick="gradeQuiz()">採点する</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <h2 id="resultHeading" tabindex="-1">📊 採点結果</h2>
    <div class="score-big"><span id="finalScore">0</span> <small>/ 40 問正解（<span id="finalPercent">0</span>%）</small></div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="unanswered-note" id="unansweredNote"></div>
    <div class="score-bar-outer"><div class="score-bar-inner" id="scoreBar"></div></div>
    <div class="table-scroll">
      <table class="section-table">
        <thead><tr><th>セクション</th><th style="text-align:center">正解数</th><th style="text-align:center">正答率</th></tr></thead>
        <tbody id="sectionTbody"></tbody>
      </table>
    </div>
    <div class="wrong-list" id="wrongList"></div>
    <div class="btn-area"><button class="reset-btn" onclick="resetQuiz()">もう一度挑戦する</button></div>
  </div>
</div>

<script>
const SECTIONS = [
  { name: "第1部：医療ドメイン・基礎知識", desc: "医療機関の運営ルールや、業界用語の正しい理解を問います。", range: [1, 10] },
  { name: "第2部：CLINICS製品概要・主要機能", desc: "CLINICSが市場で高く評価されている理由と、独自の機能について問います。", range: [11, 20] },
  { name: "第3部：経営分析・患者体験（収益向上）", desc: "収益の可視化や、患者満足度が経営に与える影響について問います。", range: [21, 30] },
  { name: "第4部：オンプレミスvsクラウド比較", desc: "「オンプレミス型」と「クラウド型」の違い、コスト、移行実務の理解を問います。", range: [31, 35] },
  { name: "第5部：オンライン診療の法制度・診療報酬・活用事例", desc: "CLINICSの強みであるオンライン診療について、営業・導入支援の武器となる正確な知識を問います。", range: [36, 40] }
];

const QUESTIONS = [
  {
    q: "日本の診療報酬制度において、医療費計算の基礎となる「1点」は何円と換算されるか？",
    opts: ["1円", "10円", "100円"],
    ans: 2,
    exp: "診療報酬点数は全国一律で「1点＝10円」と定められています。例えば初診料291点なら2,910円です。患者はこのうち自己負担割合（一般は3割）を窓口で支払います。"
  },
  {
    q: "カルテ記載の国際的標準「SOAP」のうち、患者が発した「熱が38度ある」という主観的な訴えを記録するのはどの項目か？",
    opts: ["S（Subjective）", "O（Objective）", "A（Assessment）"],
    ans: 1,
    exp: "S（Subjective＝主観的情報）は患者本人の訴え・自覚症状を記録する項目です。O（Objective）は検査値や診察所見などの客観的情報、A（Assessment）は医師の評価・診断を記録します。"
  },
  {
    q: "「SOAP」のうち、医師による診断や評価、分析結果を記録するのはどの項目か？",
    opts: ["O（Objective）", "A（Assessment）", "P（Plan）"],
    ans: 2,
    exp: "A（Assessment＝評価）は、SとOの情報をもとに医師が行う診断・評価・分析を記録する項目です。P（Plan）は今後の治療方針や処方などの計画を記録します。"
  },
  {
    q: "厚生労働省が推進する「医療DX」において、紙の処方箋の代わりにデジタルデータで運用する仕組みを何と呼ぶか？",
    opts: ["オンライン資格確認", "電子処方箋", "AI文書アシスト"],
    ans: 2,
    exp: "電子処方箋は、処方箋を電子的に発行・運用する国の仕組みです。重複投薬のチェックなどにも役立ちます。オンライン資格確認は保険資格をオンラインで確認する別の仕組みです。"
  },
  {
    q: "マイナンバーカードを健康保険証として利用し、最新の保険情報を確認する仕組みを何と呼ぶか？",
    opts: ["オンライン資格確認", "電子カルテ連携", "スマート会計"],
    ans: 1,
    exp: "オンライン資格確認は、マイナンバーカード（マイナ保険証）や保険証記号番号により、その場で最新の保険資格を確認できる仕組みです。資格過誤によるレセプト返戻の削減にもつながります。"
  },
  {
    q: "電子カルテとレセコン（レセプトコンピュータ）を別々に導入した場合に起こりやすい問題はどれか？",
    opts: ["システムの購入代金が安くなりすぎる。", "カルテの診療内容をレセコンに打ち直す「二度手間」が発生する。", "インターネットが繋がらなくなる。"],
    ans: 2,
    exp: "電子カルテとレセコンが分離していると、カルテに入力した診療内容を会計・請求のためにレセコンへ再入力する「二度手間」が発生し、入力ミスや業務負担の原因になります。レセコン一体型のCLINICSはこの課題を解消します。"
  },
  {
    q: "診療報酬の請求業務（レセプト業務）において、入力ミスや算定漏れがないかチェックする工程を何と呼ぶか？",
    opts: ["会計チェック", "レセチェック", "文書チェック"],
    ans: 2,
    exp: "レセプト提出前に入力ミス・算定漏れ・病名の不整合などを点検する工程を「レセチェック」と呼びます。ここでの精度が返戻・査定の削減、ひいてはキャッシュフローの安定に直結します。"
  },
  {
    q: "処方箋の有効期限は、原則として発行日を含めて何日間か？",
    opts: ["3日間", "4日間", "7日間"],
    ans: 2,
    exp: "処方箋の使用期間は、原則として交付日（発行日）を含めて4日間です（土日祝日も含む）。期限を過ぎると原則その処方箋では調剤を受けられません。"
  },
  {
    q: "日本の多くのクリニックで採用されている、医療費の窓口負担割合として最も一般的なものはどれか？",
    opts: ["1割", "3割", "10割"],
    ans: 2,
    exp: "69歳以下の一般的な被保険者の自己負担割合は3割です。未就学児は2割、70〜74歳は原則2割（現役並み所得者は3割）、75歳以上は原則1割など、年齢・所得により異なります。"
  },
  {
    q: "クラウド型電子カルテのメリットとして正しいものはどれか？",
    opts: ["院内に巨大なサーバーを設置する必要がある。", "インターネットがあれば、院外からもカルテの確認や入力が可能になる。", "データのバックアップを自分たちで毎日外付けHDDに取る必要がある。"],
    ans: 2,
    exp: "クラウド型はデータがデータセンターに保管されるため、インターネット環境があれば場所を選ばずアクセスできます。院内サーバーの設置や手動バックアップが不要な点もオンプレミス型に対する大きな利点です。"
  },
  {
    q: "CLINICSが掲げる「All-in-one診療支援システム」とは、具体的にどのような状態を指すか？",
    opts: ["予約、問診、カルテ、会計、オンライン診療が1つのシステムで完結すること。", "パソコン、プリンタ、iPadが全て無料でセットになっていること。", "医科だけでなく、歯科や薬局の機能も1つの画面で同時に使うこと。"],
    ans: 1,
    exp: "CLINICSの「All-in-one」とは、予約・問診・カルテ・会計・オンライン診療といった診療に必要な機能が1つのシステムに統合されていることを指します。複数ベンダーのシステムを組み合わせる必要がなく、データ連携の手間も削減できます。"
  },
  {
    q: "CLINICSが「オンライン診療」の導入実績において、どのような評価を得ているか？",
    opts: ["世界シェアNo.1", "国内導入実績No.1", "国内シェアNo.1"],
    ans: 2,
    exp: "CLINICSはオンライン診療システムの「国内導入実績No.1」の評価を得ています。「シェアNo.1」ではなく「導入実績No.1」という表現である点に注意してください。"
  },
  {
    q: "CLINICS電子カルテは、ITトレンドの「電子カルテ部門」においてどのような実績があるか？",
    opts: ["2024年上半期ランキングNo.1", "過去10年連続No.1", "2024年秋の期待度No.1"],
    ans: 1,
    exp: "CLINICS電子カルテは、比較サイト「ITトレンド」の電子カルテ部門で2024年上半期ランキングNo.1の実績があります。営業トークで実績を示す際は、年度・期間を正確に伝えることが重要です。"

    opts: ["オンライン診療に伴うシステム利用費や、お薬・処方箋の郵送代などは、事前に患者に説明し同意を得ていれば「療養の給付と直接関係ない費用（選定療養・実費）」として診察料とは別に請求してよい。", "国が定める医療費以外の費用を患者から1円でも徴収した場合は、即座に医師免許が剥奪される。", "システム利用費として、患者から1回あたり一律1万円以上の手数料を強制的に徴収しなければならない。"],
    ans: 1,
    exp: "システム利用費や薬・処方箋の郵送代は「療養の給付と直接関係ないサービス等の費用」として、事前の説明と患者の同意があれば診察料とは別に実費請求が認められています。クリニックがオンライン診療の運用コストを回収する仕組みとして、提案時に必ず押さえておきたいルールです。"
  }
];

let answers = new Array(QUESTIONS.length).fill(null);
let graded = false;

function scrollBehavior() {
  const mm = window.matchMedia;
  return mm && mm("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
}

function buildQuiz() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  SECTIONS.forEach(sec => {
    const st = document.createElement("div");
    st.className = "section-title";
    st.textContent = sec.name;
    quiz.appendChild(st);
    const sd = document.createElement("p");
    sd.className = "section-desc";
    sd.textContent = sec.desc;
    quiz.appendChild(sd);
    for (let n = sec.range[0]; n <= sec.range[1]; n++) {
      quiz.appendChild(buildQuestion(n - 1));
    }
  });
}

function buildQuestion(idx) {
  const q = QUESTIONS[idx];
  const card = document.createElement("div");
  card.className = "question-card";
  card.id = "q" + (idx + 1);
  let optsHtml = "";
  q.opts.forEach((opt, i) => {
    optsHtml += '<div class="option" data-q="' + idx + '" data-opt="' + (i + 1) + '" onclick="selectAnswer(this, true)" tabindex="' + (i === 0 ? "0" : "-1") + '" role="radio" aria-checked="false" onkeydown="optionKeydown(event, this)">' +
      '<span class="num">' + (i + 1) + '</span><span class="opt-text">' + opt + '</span></div>';
  });
  card.innerHTML =
    '<span class="q-number">問' + (idx + 1) + '</span>' +
    '<div class="q-text" id="qtext' + idx + '">' + q.q + '</div>' +
    '<div role="radiogroup" aria-labelledby="qtext' + idx + '">' + optsHtml + '</div>' +
    '<div class="judge" id="judge' + idx + '"></div>' +
    '<div class="explanation" hidden id="exp' + idx + '"><span class="exp-label">💡 解説</span>' + q.exp + '</div>';
  return card;
}

// allowToggle はマウス操作のみ true。キーボードで選択解除できてしまうと
// radio の作法（Space は冪等）に反し、意図しない未回答を生むため。
function selectAnswer(el, allowToggle) {
  if (graded) return;
  const idx = parseInt(el.dataset.q);
  const chosen = parseInt(el.dataset.opt);
  answers[idx] = allowToggle && answers[idx] === chosen ? null : chosen;

  const list = document.getElementById("q" + (idx + 1)).querySelectorAll(".option");
  list.forEach(opt => {
    const on = parseInt(opt.dataset.opt) === answers[idx];
    opt.classList.toggle("selected", on);
    opt.setAttribute("aria-checked", on ? "true" : "false");
  });
  // radiogroup は選択中の1つだけをタブ順に残す（全40問で120→40タブストップ）
  const focusIdx = answers[idx] === null ? 0 : answers[idx] - 1;
  list.forEach((opt, i) => opt.setAttribute("tabindex", i === focusIdx ? "0" : "-1"));
  updateProgress();
}

function optionKeydown(event, el) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    selectAnswer(el, false);
    return;
  }
  const STEP = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
  if (!(event.key in STEP) && event.key !== "Home" && event.key !== "End") return;
  if (graded) return;
  event.preventDefault();
  const list = [...el.parentNode.querySelectorAll(".option")];
  const cur = list.indexOf(el);
  let next;
  if (event.key === "Home") next = 0;
  else if (event.key === "End") next = list.length - 1;
  else next = (cur + STEP[event.key] + list.length) % list.length;
  selectAnswer(list[next], false);
  list[next].focus();
}

function countCorrect() {
  return answers.filter((a, i) => a === QUESTIONS[i].ans).length;
}

function countUnanswered() {
  return answers.filter(a => a === null).length;
}

function updateProgress() {
  const answered = QUESTIONS.length - countUnanswered();
  document.getElementById("answeredCount").textContent = answered;
  document.getElementById("progressFill").style.width = (answered / QUESTIONS.length * 100) + "%";

  const statusNote = document.getElementById("statusNote");
  const bottomNote = document.getElementById("bottomNote");
  if (graded) {
    statusNote.innerHTML = "正解数：<b>" + countCorrect() + "</b> / " + QUESTIONS.length + " 問";
    bottomNote.textContent = "";
    return;
  }
  const remaining = QUESTIONS.length - answered;
  // 同じ文字列を入れ直すと aria-live が同一内容を再読み上げし、
  // bottomNote は innerHTML 再生成でリンクのフォーカスが飛ぶため、変化時のみ書き換える
  const status = remaining === 0 ? "すべて回答済み" : "未回答 " + remaining + " 問";
  if (statusNote.textContent !== status) statusNote.textContent = status;
  const note = remaining === 0
    ? "すべて回答済みです。「採点する」で正誤と解説を表示します。"
    : "未回答が " + remaining + " 問あります。" +
      '<a href="#" onclick="jumpToUnanswered();return false;">最初の未回答へ移動</a>';
  if (bottomNote.innerHTML !== note) bottomNote.innerHTML = note;
}

function jumpToUnanswered() {
  const idx = answers.findIndex(a => a === null);
  if (idx === -1) return;
  const card = document.getElementById("q" + (idx + 1));
  card.scrollIntoView({ behavior: scrollBehavior(), block: "center" });
  card.querySelector(".option").focus({ preventScroll: true });
}

function gradeQuiz() {
  if (graded) return;
  const unanswered = countUnanswered();
  if (unanswered > 0) {
    const proceed = confirm("未回答が " + unanswered + " 問あります。\n未回答は不正解として採点されます。このまま採点しますか？");
    if (!proceed) { jumpToUnanswered(); return; }
  }
  graded = true;
  document.getElementById("quiz").classList.add("graded");
  document.querySelector(".progress-wrap").classList.add("graded");
  document.getElementById("bottomActions").hidden = true;
  // 誤答リンクで上へ飛んだあと結果へ戻れるよう、採点ボタンの枠を再利用する
  const btn = document.getElementById("gradeBtn");
  btn.textContent = "結果へ";
  btn.onclick = scrollToResult;
  QUESTIONS.forEach((_, i) => revealQuestion(i));
  updateProgress();
  showResult();
}

function scrollToResult() {
  document.getElementById("resultPanel").scrollIntoView({ behavior: scrollBehavior() });
  document.getElementById("resultHeading").focus({ preventScroll: true });
}

function revealQuestion(idx) {
  const card = document.getElementById("q" + (idx + 1));
  const correct = QUESTIONS[idx].ans;
  const chosen = answers[idx];
  card.querySelectorAll(".option").forEach(opt => {
    const o = parseInt(opt.dataset.opt);
    if (o === correct) opt.classList.add("correct");
    else if (o === chosen) opt.classList.add("wrong");
    else opt.classList.add("dimmed");
    opt.setAttribute("tabindex", "-1");
    opt.setAttribute("aria-disabled", "true");
    if (o === chosen) {
      const mark = document.createElement("span");
      mark.className = "your-mark";
      mark.textContent = "あなたの回答";
      opt.appendChild(mark);
    }
  });

  const judge = document.getElementById("judge" + idx);
  const answerText = "正解は「" + correct + ". " + QUESTIONS[idx].opts[correct - 1] + "」";
  if (chosen === null) {
    judge.textContent = "⚠️ 未回答… " + answerText;
    judge.className = "judge na";
  } else if (chosen === correct) {
    judge.textContent = "⭕ 正解！";
    judge.className = "judge ok";
  } else {
    judge.textContent = "❌ 不正解… " + answerText;
    judge.className = "judge ng";
  }
  // hidden 属性で隠しているのはリーダーモード等の抽出系に解説が拾われないようにするため
  const exp = document.getElementById("exp" + idx);
  exp.removeAttribute("hidden");
  exp.style.display = "block";
}

function showResult() {
  const total = QUESTIONS.length;
  const correct = countCorrect();
  const percent = Math.round(correct / total * 100);
  const unanswered = countUnanswered();

  document.getElementById("finalScore").textContent = correct;
  document.getElementById("finalPercent").textContent = percent;

  const msg = document.getElementById("scoreMsg");
  const scoreBig = document.querySelector(".score-big");
  if (percent === 100) { msg.textContent = "🏆 全問正解！完璧です！"; scoreBig.classList.add("perfect"); }
  else if (percent >= 90) { msg.textContent = "🎉 素晴らしい！合格レベルです。間違えた問題だけ復習しましょう。"; }
  else if (percent >= 70) { msg.textContent = "👍 あと一歩！間違えた問題の解説をしっかり読み込みましょう。"; }
  else { msg.textContent = "📖 もう一度資料を確認して、再挑戦しましょう。"; }

  document.getElementById("unansweredNote").textContent =
    unanswered > 0 ? "※ 未回答 " + unanswered + " 問は不正解として集計しています。" : "";

  const bar = document.getElementById("scoreBar");
  bar.style.background = percent >= 90 ? "var(--good)" : percent >= 70 ? "var(--warn)" : "var(--bad)";
  setTimeout(() => { bar.style.width = percent + "%"; }, 100);

  const tbody = document.getElementById("sectionTbody");
  tbody.innerHTML = "";
  SECTIONS.forEach(sec => {
    let secCorrect = 0;
    const count = sec.range[1] - sec.range[0] + 1;
    for (let n = sec.range[0]; n <= sec.range[1]; n++) {
      if (answers[n - 1] === QUESTIONS[n - 1].ans) secCorrect++;
    }
    const pct = Math.round(secCorrect / count * 100);
    tbody.innerHTML += "<tr><td>" + sec.name + '</td><td class="num-cell">' + secCorrect + " / " + count + '</td><td class="num-cell">' + pct + "%</td></tr>";
  });

  const wrongs = [];
  answers.forEach((a, i) => { if (a !== QUESTIONS[i].ans) wrongs.push(i + 1); });
  const wrongList = document.getElementById("wrongList");
  if (wrongs.length === 0) {
    wrongList.innerHTML = "間違えた問題はありません。お見事です！";
  } else {
    wrongList.innerHTML = "<b>間違えた・未回答の問題（クリックで移動）：</b><br>" +
      wrongs.map(n => '<a href="#q' + n + '">問' + n + "</a>").join("");
  }

  document.getElementById("resultPanel").style.display = "block";
  // 下部の採点ボタンを hidden にするとフォーカスが body に落ちるため、見出しへ移す
  scrollToResult();
}

function resetQuiz() {
  answers = new Array(QUESTIONS.length).fill(null);
  graded = false;
  document.getElementById("quiz").classList.remove("graded");
  document.querySelector(".progress-wrap").classList.remove("graded");
  document.getElementById("bottomActions").hidden = false;
  const btn = document.getElementById("gradeBtn");
  btn.textContent = "採点する";
  btn.onclick = gradeQuiz;
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("scoreBar").style.width = "0%";
  document.querySelector(".score-big").classList.remove("perfect");
  buildQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: scrollBehavior() });
}

buildQuiz();
updateProgress();
</script>
</body>
</html>
